<style>
/* Layout : carte plein écran façon GPS ; bandeau du haut = panneau + seuil + vitesse ; barre du bas = commandes. */
:root{
  --bg:#0b0e12; --panel:rgba(18,22,28,.92); --solid:#141920; --line:#2a323d; --fg:#eef2f6; --muted:#8e9aab;
  --sign:#d8261d; --signface:#f7f7f2; --ok:#35c873; --warn:#f2a700; --bad:#ff4438; --route:#3aa0ff;
  --l30:#7fd1ff; --l50:#3aa0ff; --l70:#9b7bff; --l80:#f2c200; --l90:#f2a700; --l110:#ff7a1a; --l130:#ff4438;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;background:#10141a;z-index:0}
.leaflet-container{font-family:var(--body);background:#10141a}
.leaflet-control-attribution{background:rgba(11,14,18,.75)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:#b8c4d4!important}
.leaflet-control-zoom{display:none}

.hud{position:fixed;top:0;left:0;right:0;z-index:500;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.card{pointer-events:auto;max-width:520px;margin-inline:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sign{width:84px;height:84px;border-radius:50%;background:var(--signface);border:9px solid var(--sign);box-sizing:border-box;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#111;font-size:36px;line-height:1;
  font-variant-numeric:tabular-nums;transition:transform .25s}
.sign.unknown{background:var(--solid);color:var(--muted);border-color:var(--line)}
.sign.pulse{transform:scale(1.08)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.flash .val{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.val small{font-size:.38em;font-weight:600;color:var(--muted);margin-left:3px}
.rain-note{font-size:12px;color:var(--warn);margin-top:2px;min-height:0}
.speed{text-align:right;border-radius:12px;padding:6px 10px;border:2px solid transparent}
.speed .val{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.speed.ok{border-color:var(--ok)} .speed.warn{border-color:var(--warn)}
.speed.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,transparent)}
.status{pointer-events:auto;max-width:520px;margin:8px auto 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.on{color:var(--fg)} .chip.on i{background:var(--ok)} .chip.wait i{background:var(--warn)}
.chip.err{color:var(--bad)} .chip.err i{background:var(--bad)}
.msg{font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
.msg:empty{display:none} .msg.err{color:var(--bad)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:500;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.controls{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  min-height:52px;padding:8px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--fg);background:#26303c}
#start{font-family:var(--display);font-size:22px;letter-spacing:.06em;text-transform:uppercase;background:var(--sign);border-color:var(--sign);color:#fff}
#start.stop{background:var(--panel);border-color:var(--line)}
#recenter,#baseBtn{position:fixed;z-index:500;right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 76px);min-height:44px;border-radius:999px;padding:8px 14px;font-size:14px}
#recenter{bottom:calc(env(safe-area-inset-bottom,0px) + 128px)}
.legend{position:fixed;z-index:400;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;gap:6px;flex-wrap:wrap;max-width:60vw;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.legend b{width:14px;height:4px;border-radius:2px;display:inline-block}
.me{width:34px;height:34px;display:grid;place-items:center}
.me svg{width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));transition:transform .4s}
@media (max-width:380px){.sign{width:72px;height:72px;font-size:31px;border-width:8px}.flash .val,.speed .val{font-size:38px}.card{gap:10px}}
@media (prefers-reduced-motion:reduce){.sign,.me svg{transition:none}}
</style>

<div id="map" aria-label="Carte"></div>

<div class="hud">
  <div class="card">
    <div class="sign unknown" id="sign" aria-live="polite">–</div>
    <div class="flash">
      <div class="lbl">Flash dès</div>

</div>

<div class="legend" id="legend"></div>
<button id="recenter" type="button" hidden>Recentrer</button>
<button id="baseBtn" type="button" aria-label="Changer de fond de carte">Plan</button>

<div class="bar">

</div>

  const A=project(pos,a),B=project(pos,b),dx=B.x-A.x,dy=B.y-A.y,L=dx*dx+dy*dy;
  let t=L?(-(A.x*dx+A.y*dy))/L:0; t=Math.max(0,Math.min(1,t));
  return {dist:Math.hypot(A.x+t*dx,A.y+t*dy), bearing:(Math.atan2(dx,dy)*180/Math.PI+360)%360};
}
const angDiff=(a,b)=>{ const d=Math.abs(a-b)%360; return d>180?360-d:d; };
const dist=(a,b)=>{ const p=project(a,b); return Math.hypot(p.x,p.y); };
function bearing(a,b){ const p=project(a,b); return (Math.atan2(p.x,p.y)*180/Math.PI+360)%360; }

function matchWay(pos,heading){
  let best=null;
  for(const w of S.ways){
    const g=w.geometry; if(!g||g.length<2) continue;
    for(let i=0;i<g.length-1;i++){
      const s=segInfo(pos,g[i],g[i+1]); if(s.dist>MATCH_MAX) continue;
      let score=s.dist, dir="fwd";
      if(heading!=null){
        const df=angDiff(heading,s.bearing), db=angDiff(heading,(s.bearing+180)%360);
        dir=df<=db?"fwd":"bwd"; const off=Math.min(df,db);
        if(w.tags.oneway==="yes"&&dir==="bwd") score+=60;
        score+=off>45?30:off/3;
      }
      if(!best||score<best.score) best={score,w,dir};
    }
  }
  if(!best) return null;
  const t=best.w.tags;
  const v=parseMaxspeed(best.dir==="fwd"?t["maxspeed:forward"]:t["maxspeed:backward"])??parseMaxspeed(t.maxspeed);
  return v==null?null:{limit:v,id:best.w.id+":"+best.dir,way:best.w};
}

/* ---------- Carte ---------- */
let BASES=null, curBase=null;
const ORDER=["plan","sat","nuit"];
function loadPref(){ try{ const v=localStorage.getItem("seuil-base"); return ORDER.includes(v)?v:null; }catch(e){ return null; } }
function setBase(k){
  if(!map||!BASES) return;
  if(curBase) BASES[curBase].layers.forEach(l=>map.removeLayer(l));
  BASES[k].layers.forEach(l=>l.addTo(map));
  curBase=k; $("baseBtn").textContent="Fond : "+BASES[k].name;
  try{ localStorage.setItem("seuil-base",k); }catch(e){}
}
let map=null, layerWays=null, layerMatch=null, meMarker=null, demoLine=null;
const ARROW='<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#3aa0ff" fill-opacity=".22"/><path d="M17 4 L27 28 L17 22 L7 28 Z" fill="#3aa0ff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
function initMap(){
  if(!window.L){ say("La carte n'a pas pu se charger. Les annonces fonctionnent quand même.",true); return; }
  map=L.map("map",{zoomControl:false,attributionControl:true}).setView([44.8378,-0.5792],13);
  const OSM='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const ESRI='Images © Esri, Maxar, Earthstar Geographics';
  const esri=s=>`https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
  BASES={
    plan:{name:"Plan",layers:[L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:OSM+' © <a href="https://carto.com/attributions">CARTO</a>'})]},
    sat:{name:"Satellite",layers:[
      L.tileLayer(esri("World_Imagery"),{maxZoom:19,maxNativeZoom:18,attribution:ESRI}),
      L.tileLayer(esri("Reference/World_Transportation"),{maxZoom:19,maxNativeZoom:18,opacity:.9}),
      L.tileLayer(esri("Reference/World_Boundaries_and_Places"),{maxZoom:19,maxNativeZoom:18})]},
    nuit:{name:"Nuit",layers:[L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:OSM+' © <a href="https://carto.com/attributions">CARTO</a>'})]}
  };
  setBase(loadPref()||"plan");
  layerWays=L.layerGroup().addTo(map); layerMatch=L.layerGroup().addTo(map);
  map.on("dragstart",()=>{ if(S.running){ S.follow=false; $("recenter").hidden=false; } });
  const lg=$("legend"); lg.innerHTML=LIMIT_COLORS.map(([v,t])=>`<span><b style="background:${css(t)}"></b>${v}</span>`).join("");
}
function drawWays(){
  if(!layerWays) return; layerWays.clearLayers();
  for(const w of S.ways){ const l=wayLimit(w.tags);
    L.polyline(w.geometry.map(p=>[p.lat,p.lon]),{color:colorFor(l),weight:3,opacity:.55,interactive:false}).addTo(layerWays); }
}
function drawMatch(w,lim){
  if(!layerMatch) return; layerMatch.clearLayers(); if(!w) return;
  const pts=w.geometry.map(p=>[p.lat,p.lon]);
  L.polyline(pts,{color:"#fff",weight:11,opacity:.9,interactive:false}).addTo(layerMatch);
  L.polyline(pts,{color:colorFor(lim),weight:7,opacity:1,interactive:false}).addTo(layerMatch);
}
function updateMe(pos,heading){
  if(!map) return;
  if(!meMarker) meMarker=L.marker([pos.lat,pos.lon],{icon:L.divIcon({className:"me",html:ARROW,iconSize:[34,34],iconAnchor:[17,17]}),interactive:false,zIndexOffset:1000}).addTo(map);
  else meMarker.setLatLng([pos.lat,pos.lon]);
  if(heading!=null){ S.heading=heading; const svg=meMarker.getElement()&&meMarker.getElement().querySelector("svg"); if(svg) svg.style.transform=`rotate(${heading}deg)`; }
  if(S.follow){ const z=S.speed!=null&&S.speed>90?15:S.speed!=null&&S.speed>55?16:17;
    map.setView([pos.lat,pos.lon],z,{animate:true}); }
}

/* ---------- Données OSM ---------- */
async function fetchWays(pos){
  if(S.fetching) return; S.fetching=true; setChip("chipData","wait");
  const q=`[out:json][timeout:20];way(around:${FETCH_RADIUS},${pos.lat.toFixed(6)},${pos.lon.toFixed(6)})[highway][~"^maxspeed"~"."];out tags geom;`;
  for(const url of OVERPASS){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),20000);
      const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctrl.signal});
      clearTimeout(to); if(!r.ok) throw new Error(r.status);
      const j=await r.json();
      S.ways=(j.elements||[]).filter(e=>e.type==="way"&&e.geometry);
      S.fetchCenter=pos; S.fetching=false; setChip("chipData","on"); drawWays(); return;
    }catch(e){}
  }
  S.fetching=false; setChip("chipData","err");
  say("Limites injoignables, nouvel essai dans 8 s.",true);
  setTimeout(()=>{ if(S.running&&!S.demo&&S.lastFix) fetchWays(S.lastFix); },8000);
}

/* ---------- Voix et son ---------- */
function speak(text){
  if(!S.voice||!("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="fr-FR"; u.rate=1.05; speechSynthesis.speak(u);}catch(e){}
}
function beep(){
  try{ if(!S.audio) return; const c=S.audio,o=c.createOscillator(),g=c.createGain();
    o.frequency.value=880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(.4,c.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35); o.start(); o.stop(c.currentTime+.4);}catch(e){}
}

/* ---------- Affichage ---------- */
function setChip(id,st){ $(id).className="chip"+(st?" "+st:""); }
function say(t,err){ const m=$("msg"); m.textContent=t; m.className="msg"+(err?" err":""); }

function applyLimit(base){
  S.baseLimit=base;
  const lim=S.rain?rainLimit(base):base;
  const changed=lim!==S.limit; S.limit=lim;
  const sign=$("sign");
  if(lim==null){ sign.textContent="?"; sign.classList.add("unknown"); $("flash").innerHTML="–<small>km/h</small>"; }
  else{ sign.textContent=lim; sign.classList.remove("unknown"); $("flash").innerHTML=flashFrom(lim)+"<small>km/h</small>"; }
  $("rainNote").textContent=(S.rain&&base!=null&&lim!==base)?`Pluie : ${base} → ${lim}`:"";
  if(changed){
    sign.classList.add("pulse"); setTimeout(()=>sign.classList.remove("pulse"),260);
    if(lim==null) speak("Limitation inconnue sur cette route.");
    else speak(`Limite ${lim}. Le radar flashe dès ${flashFrom(lim)}.`);
  }
  renderSpeed();
}

function renderSpeed(){
  const box=$("speedBox"), sp=S.speed;
  $("speed").innerHTML=(sp==null?"–":Math.round(sp))+"<small>km/h</small>";
  box.className="speed";
  if(sp!=null&&S.limit!=null){
    const f=flashFrom(S.limit), now=Date.now();
    if(sp>=f){ box.classList.add("bad"); if(now-S.lastWarnFlash>15000){ S.lastWarnFlash=now; beep(); speak("Attention, ralentis."); } }
    else if(sp>S.limit+1){ box.classList.add("warn"); }
    else box.classList.add("ok");
    if(sp>S.limit+2&&sp<f){ if(!S.overSince) S.overSince=now;
      if(now-S.overSince>3000&&now-S.lastWarnLimit>30000){ S.lastWarnLimit=now; speak(`Tu dépasses la limite de ${S.limit}.`); } }
    else S.overSince=0;
  }
}

/* ---------- Traitement d'une position ---------- */
function handlePosition(pos,sp,heading,accuracy){
  S.speed=sp;
  updateMe(pos,heading);
  if(S.demo){ S.lastFix=pos; return; }
  if(!S.fetchCenter||dist(S.fetchCenter,pos)>REFETCH_DIST) fetchWays(pos);
  const m=S.ways.length?matchWay(pos,heading):null;
  const key=m?m.id+"|"+m.limit:"none";
  if(key===S.candidate) S.candidateCount++; else { S.candidate=key; S.candidateCount=1; }
  if(S.candidateCount>=2||(S.baseLimit===null&&m)){
    if(m!==S.matched){ S.matched=m; drawMatch(m&&m.way,m&&m.limit); }
    const v=m?m.limit:null; if(v!==S.baseLimit) applyLimit(v);
  }
  say(accuracy>60?`Précision GPS faible (${Math.round(accuracy)} m).`:"");
  renderSpeed();
}

function onFix(p){
  setChip("chipGps","on");
  const pos={lat:p.coords.latitude,lon:p.coords.longitude,t:p.timestamp||Date.now()};
  let sp=(p.coords.speed!=null&&p.coords.speed>=0)?p.coords.speed*3.6:null;
  if(sp==null&&S.lastFix){ const dt=(pos.t-S.lastFix.t)/1000; if(dt>0.5&&dt<10) sp=dist(S.lastFix,pos)/dt*3.6; }
  let heading=(p.coords.heading!=null&&!isNaN(p.coords.heading)&&sp!=null&&sp>8)?p.coords.heading:null;
  if(heading==null&&S.lastFix&&dist(S.lastFix,pos)>8) heading=bearing(S.lastFix,pos);
  S.lastFix=pos;
  handlePosition(pos,sp,heading,p.coords.accuracy);
}
function onGpsError(e){
  setChip("chipGps","err");
  if(e.code===1) say("Localisation refusée : autorise-la pour ce site dans le navigateur.",true);
  else say("Pas de signal GPS pour l'instant, je continue d'essayer.",true);
}

/* ---------- Démo : trajet simulé Bordeaux → A10 ---------- */
const DEMO_ROUTE=[
  {lim:50, pts:[[44.8443,-0.5737],[44.8497,-0.5700],[44.8552,-0.5663],[44.8600,-0.5622]]},
  {lim:80, pts:[[44.8600,-0.5622],[44.8668,-0.5560],[44.8735,-0.5470]]},
  {lim:110,pts:[[44.8735,-0.5470],[44.8790,-0.5390],[44.8838,-0.5285],[44.8880,-0.5170]]},
  {lim:130,pts:[[44.8880,-0.5170],[44.9030,-0.5020],[44.9230,-0.4870],[44.9470,-0.4700],[44.9700,-0.4560]]}
];
const DEMO_SPEEDS={50:[38,46,49,53,57,48],80:[66,77,84,87,79],110:[100,108,114,117,109],130:[122,129,134,138,131]};
function startDemo(){
  setChip("chipGps","on"); setChip("chipData","on"); say("Démo : trajet simulé de Bordeaux vers l'A10.");
  const seq=[];
  DEMO_ROUTE.forEach(seg=>{ const sp=DEMO_SPEEDS[seg.lim]; const n=sp.length*3;
    for(let k=0;k<n;k++){ const f=k/n*(seg.pts.length-1), i=Math.floor(f), t=f-i, a=seg.pts[i], b=seg.pts[Math.min(i+1,seg.pts.length-1)];
      seq.push({lat:a[0]+(b[0]-a[0])*t,lon:a[1]+(b[1]-a[1])*t,lim:seg.lim,sp:sp[Math.floor(k/3)]}); } });
  if(map){ layerWays.clearLayers(); layerMatch.clearLayers();
    DEMO_ROUTE.forEach(seg=>L.polyline(seg.pts,{color:colorFor(seg.lim),weight:3,opacity:.55,interactive:false}).addTo(layerWays)); }
  let i=0,curSeg=-1;
  const tick=()=>{ const p=seq[i], prev=seq[i-1];
    const segIdx=DEMO_ROUTE.findIndex(s=>s.lim===p.lim);
    if(segIdx!==curSeg){ curSeg=segIdx; const lim=S.rain?rainLimit(p.lim):p.lim;
      if(map){ layerMatch.clearLayers(); const pts=DEMO_ROUTE[segIdx].pts;
        L.polyline(pts,{color:"#fff",weight:11,opacity:.9,interactive:false}).addTo(layerMatch);
        L.polyline(pts,{color:colorFor(lim),weight:7,interactive:false}).addTo(layerMatch); }
      applyLimit(p.lim); }
    handlePosition({lat:p.lat,lon:p.lon},p.sp,prev?bearing(prev,p):null,10); renderSpeed();
    i=(i+1)%seq.length; if(i===0){ curSeg=-1; S.limit=null; }
  };
  tick(); S.demoTimer=setInterval(tick,700);
}

/* ---------- Démarrage / arrêt ---------- */
async function wake(){ try{ if("wakeLock" in navigator) S.wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(S.running&&document.visibilityState==="visible") wake(); });

function start(demo){
  S.running=true; S.demo=demo; S.follow=true; $("recenter").hidden=true;
  S.limit=null; S.baseLimit=null; S.candidate=null; S.matched=null; S.speed=null; S.lastFix=null;
  try{ S.audio=S.audio||new (window.AudioContext||window.webkitAudioContext)(); S.audio.resume(); }catch(e){}
  if("speechSynthesis" in window){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance("")); }catch(e){} }
  wake();
  $("start").textContent="Arrêter"; $("start").classList.add("stop"); $("demo").setAttribute("aria-pressed",String(demo));
  if(demo){ startDemo(); return; }
  if(!("geolocation" in navigator)){ say("Ce navigateur ne donne pas accès au GPS.",true); setChip("chipGps","err"); return; }
  setChip("chipGps","wait"); say("Recherche du signal GPS…");
  S.watchId=navigator.geolocation.watchPosition(onFix,onGpsError,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
function stop(){
  S.running=false;
  if(S.watchId!=null) navigator.geolocation.clearWatch(S.watchId); S.watchId=null;
  clearInterval(S.demoTimer); S.demoTimer=null;
  try{ S.wakeLock&&S.wakeLock.release(); }catch(e){} S.wakeLock=null;
  try{ speechSynthesis.cancel(); }catch(e){}
  $("start").textContent="Démarrer"; $("start").classList.remove("stop"); $("demo").setAttribute("aria-pressed","false");
  $("recenter").hidden=true; setChip("chipGps",""); S.speed=null; renderSpeed(); say("Arrêté.");
  if(S.demo){ S.ways=[]; S.fetchCenter=null; if(layerWays){ layerWays.clearLayers(); layerMatch.clearLayers(); } }
  S.demo=false;
}

$("start").addEventListener("click",()=>S.running?stop():start(false));
$("demo").addEventListener("click",()=>{ const wasDemo=S.running&&S.demo; if(S.running) stop(); if(!wasDemo) start(true); });
$("rain").addEventListener("click",()=>{ S.rain=!S.rain; $("rain").setAttribute("aria-pressed",String(S.rain)); if(S.baseLimit!=null) applyLimit(S.baseLimit); });
$("voice").addEventListener("click",()=>{ S.voice=!S.voice; $("voice").setAttribute("aria-pressed",String(S.voice)); if(!S.voice) try{speechSynthesis.cancel();}catch(e){} });
$("baseBtn").addEventListener("click",()=>{ if(!curBase) return; setBase(ORDER[(ORDER.indexOf(curBase)+1)%ORDER.length]); });
$("recenter").addEventListener("click",()=>{ S.follow=true; $("recenter").hidden=true; if(S.lastFix&&map) map.setView([S.lastFix.lat,S.lastFix.lon],16); });

initMap();
})();
</script>
